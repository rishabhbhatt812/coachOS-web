<div class="teacher-tests-container p-6">
  <div class="header-section mb-8 flex justify-between items-center">
    <div>
      <h1 class="text-3xl font-bold text-gray-800 tracking-tight">Tests & Assessments</h1>
      <p class="text-gray-500 mt-1">Manage class tests and grade submissions.</p>
    </div>
    <button mat-flat-button color="primary" class="create-btn" (click)="toggleCreateForm()" *ngIf="!showCreateForm">
      <mat-icon>add</mat-icon> Schedule Test
    </button>
  </div>

  <!-- Create Form -->
  <div class="form-card card mb-8" *ngIf="showCreateForm">
    <div class="form-card-header">
      <div>
        <h3>
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="header-icon"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
          Schedule New Test / Exam
        </h3>
        <p>Set up periodic chapter tests, quizzes, and mock exams for your assigned batches</p>
      </div>
      <button type="button" class="btn-close" (click)="toggleCreateForm()">✕</button>
    </div>
    
    <div class="form-card-body">
      <div class="form-grid">
        <div class="form-group">
          <label>Test Title / Name <span class="required-star">*</span></label>
          <input type="text" class="form-control" [(ngModel)]="newTest.testName" placeholder="e.g. Chapter 3: Laws of Motion Quiz" />
        </div>

        <div class="form-group">
          <label>Target Batch <span class="required-star">*</span></label>
          <select class="form-control" [(ngModel)]="newTest.batchId">
            <option [ngValue]="undefined" disabled selected>Select a batch</option>
            <option *ngFor="let batch of batches" [value]="batch.id">{{ batch.name }}</option>
          </select>
        </div>

        <div class="form-group">
          <label>Test Date <span class="required-star">*</span></label>
          <input type="date" class="form-control" [(ngModel)]="newTest.testDate" />
        </div>

        <div class="form-group">
          <label>Maximum Marks <span class="required-star">*</span></label>
          <input type="number" class="form-control" [(ngModel)]="newTest.maxMarks" min="1" placeholder="e.g. 100" />
        </div>

        <div class="form-group full-width">
          <label>Syllabus Topics & Instructions</label>
          <textarea class="form-control" [(ngModel)]="newTest.syllabus" rows="3" placeholder="Specify covered chapters, test format (MCQ/Subjective) and calculators permitted..."></textarea>
        </div>
      </div>

      <div class="form-actions flex justify-end gap-3 mt-6 pt-4 border-t border-gray-100">
        <button type="button" class="btn btn-light" (click)="toggleCreateForm()">Cancel</button>
        <button type="button" class="btn btn-primary" (click)="submitTest()">
          ✓ Schedule Assessment
        </button>
      </div>
    </div>
  </div>

  <div class="table-card card shadow-sm rounded-xl border border-gray-100 overflow-hidden" *ngIf="!showCreateForm">
    <div *ngIf="isLoading$ | async" class="loading-indicator p-8 text-center text-gray-500">
      <div class="spinner"></div>
      <p>Loading assessment records...</p>
    </div>
    
    <app-data-table 
      *ngIf="!(isLoading$ | async)"
      [columns]="columns" 
      [data]="(tests$ | async) || []"
      (actionClicked)="onActionClicked($event)">
    </app-data-table>
  </div>
</div>
