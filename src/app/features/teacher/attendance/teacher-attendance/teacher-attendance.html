<div class="attendance-container p-6">
  <div class="header-section mb-8">
    <div>
      <h1 class="text-3xl font-bold text-gray-800 tracking-tight">Mark Attendance</h1>
      <p class="text-gray-500 mt-1">Select a batch and date to record daily attendance.</p>
    </div>
  </div>

  <mat-card class="filter-card mb-8">
    <mat-card-content class="filter-flex">
      <mat-form-field appearance="outline" class="flex-1">
        <mat-label>Select Batch</mat-label>
        <mat-select [(ngModel)]="selectedBatchId">
          <mat-option *ngFor="let batch of batches" [value]="batch.id">
            {{ batch.name }}
          </mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline" class="flex-1">
        <mat-label>Date</mat-label>
        <input matInput [matDatepicker]="picker" [(ngModel)]="selectedDate">
        <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
        <mat-datepicker #picker></mat-datepicker>
      </mat-form-field>

      <button mat-flat-button color="primary" class="load-btn" [disabled]="!selectedBatchId" (click)="loadStudents()">
        <mat-icon>search</mat-icon> Load Students
      </button>
    </mat-card-content>
  </mat-card>

  <mat-card class="attendance-card" *ngIf="isLoaded">
    <mat-card-header class="flex justify-between items-center mb-4">
      <mat-card-title>Student List</mat-card-title>
      <button mat-stroked-button color="primary" (click)="markAllPresent()">
        <mat-icon>done_all</mat-icon> Mark All Present
      </button>
    </mat-card-header>

    <mat-card-content>
      <table mat-table [dataSource]="students" class="w-full attendance-table">
        
        <!-- Checkbox Column -->
        <ng-container matColumnDef="present">
          <th mat-header-cell *matHeaderCellDef> Present </th>
          <td mat-cell *matCellDef="let element">
            <mat-checkbox [(ngModel)]="element.isPresent" color="primary"></mat-checkbox>
          </td>
        </ng-container>

        <!-- Roll No Column -->
        <ng-container matColumnDef="rollNo">
          <th mat-header-cell *matHeaderCellDef> Roll No </th>
          <td mat-cell *matCellDef="let element"> {{element.rollNo}} </td>
        </ng-container>

        <!-- Name Column -->
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef> Name </th>
          <td mat-cell *matCellDef="let element" class="font-medium text-gray-800"> {{element.name}} </td>
        </ng-container>

        <!-- Remarks Column -->
        <ng-container matColumnDef="remarks">
          <th mat-header-cell *matHeaderCellDef> Remarks </th>
          <td mat-cell *matCellDef="let element">
            <mat-form-field appearance="outline" class="w-full remarks-input" subscriptSizing="dynamic">
              <input matInput [(ngModel)]="element.remarks" placeholder="Optional remark">
            </mat-form-field>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;" [class.absent-row]="!row.isPresent"></tr>
      </table>
    </mat-card-content>

    <mat-card-actions class="flex justify-end p-4 border-t border-gray-100">
      <button mat-flat-button color="accent" class="save-btn" (click)="saveAttendance()">
        <mat-icon>save</mat-icon> Save Attendance
      </button>
    </mat-card-actions>
  </mat-card>
</div>
