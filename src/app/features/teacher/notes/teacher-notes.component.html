<div class="teacher-notes-container p-6">
  <div class="header-section mb-8 flex justify-between items-center">
    <div>
      <h1 class="text-3xl font-bold text-gray-800 tracking-tight">Study Material & Notes</h1>
      <p class="text-gray-500 mt-1">Upload and manage course syllabus resources.</p>
    </div>
    <button mat-flat-button color="primary" class="create-btn" (click)="toggleUploadForm()" *ngIf="!showUploadForm">
      <mat-icon>upload_file</mat-icon> Upload Material
    </button>
  </div>

  <!-- Upload Form -->
  <div class="form-card card mb-8" *ngIf="showUploadForm">
    <div class="form-card-header">
      <div>
        <h3>
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="header-icon"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
          Upload Study Material & Notes
        </h3>
        <p>Share PDF lecture notes, formula sheets, sample questions and presentation decks</p>
      </div>
      <button type="button" class="btn-close" (click)="toggleUploadForm()">✕</button>
    </div>
    
    <div class="form-card-body">
      <div class="form-grid">
        <div class="form-group">
          <label>Resource Title <span class="required-star">*</span></label>
          <input type="text" class="form-control" [(ngModel)]="newNote.title" placeholder="e.g. Chapter 4: Thermodynamics Complete Revision Notes" />
        </div>

        <div class="form-group">
          <label>Target Batch <span class="required-star">*</span></label>
          <select class="form-control" [(ngModel)]="newNote.batchId">
            <option [ngValue]="undefined" disabled selected>Choose a batch</option>
            <option *ngFor="let batch of batches" [value]="batch.id">{{ batch.name }}</option>
          </select>
        </div>

        <div class="form-group full-width">
          <label>Resource Description (Optional)</label>
          <textarea class="form-control" [(ngModel)]="newNote.description" rows="3" placeholder="Brief summary of what this document covers, author notes, or recommended reading order..."></textarea>
        </div>
      </div>

      <div class="upload-section mt-6">
        <label class="font-bold text-gray-700 mb-2 block text-sm">Select Document File (Max 10MB)</label>
        <app-file-upload 
          [maxSizeBytes]="10 * 1024 * 1024"
          [allowedTypes]="['.pdf', '.docx', '.pptx', '.zip']"
          (fileSelected)="onFileSelected($event)">
        </app-file-upload>
      </div>

      <div class="form-actions flex justify-end gap-3 mt-6 pt-4 border-t border-gray-100">
        <button type="button" class="btn btn-light" (click)="toggleUploadForm()">Cancel</button>
        <button type="button" class="btn btn-primary" (click)="submitNote()">
          ✓ Upload & Distribute Material
        </button>
      </div>
    </div>
  </div>

  <div class="table-card card shadow-sm rounded-xl border border-gray-100 overflow-hidden" *ngIf="!showUploadForm">
    <div *ngIf="isLoading$ | async" class="loading-indicator p-8 text-center text-gray-500">
      <div class="spinner"></div>
      <p>Loading files list...</p>
    </div>
    
    <app-data-table 
      *ngIf="!(isLoading$ | async)"
      [columns]="columns" 
      [data]="(notes$ | async) || []"
      (actionClicked)="onActionClicked($event)">
    </app-data-table>
  </div>
</div>
