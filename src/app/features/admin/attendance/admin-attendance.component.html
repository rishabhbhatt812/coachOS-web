<app-page-header title="Attendance" subtitle="Log and monitor student attendance sessions">
  <button class="btn btn-primary" (click)="toggleForm()">
    {{ showAddForm ? 'Close Form' : '+ Log Attendance' }}
  </button>
</app-page-header>

<div class="attendance-container">
  <!-- Collapsible Attendance Form -->
  <div class="form-card card" *ngIf="showAddForm">
    <div class="card-header">
      <h3>Create Attendance Session</h3>
    </div>
    
    <form [formGroup]="attendanceForm" (ngSubmit)="onSubmit()" class="attendance-form">
      <div class="form-grid">
        <mat-form-field appearance="outline">
          <mat-label>Select Batch</mat-label>
          <select matNativeControl formControlName="batchId">
            <option value="" disabled selected>Choose a batch</option>
            <option *ngFor="let batch of batches$ | async" [value]="batch.id">
              {{ batch.name }} ({{ batch.courseName }})
            </option>
          </select>
          <mat-error *ngIf="attendanceForm.get('batchId')?.hasError('required')">Batch selection is required</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Attendance Date</mat-label>
          <input matInput type="date" formControlName="attendanceDate" />
          <mat-error *ngIf="attendanceForm.get('attendanceDate')?.hasError('required')">Attendance date is required</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Logged By User ID (Optional)</mat-label>
          <input matInput formControlName="takenByUserId" placeholder="UUID of logger" />
        </mat-form-field>
      </div>

      <div class="form-actions">
        <button mat-raised-button color="primary" type="submit" [disabled]="attendanceForm.invalid || (isLoading$ | async)">
          Log Session
        </button>
        <button mat-button type="button" (click)="toggleForm()">Cancel</button>
      </div>
    </form>
  </div>

  <!-- Attendance Sessions Table List -->
  <div class="table-card card">
    <div *ngIf="isLoading$ | async" class="loading-indicator">
      <div class="spinner"></div>
      <p>Loading attendance registers...</p>
    </div>
    
    <app-data-table 
      *ngIf="!(isLoading$ | async)"
      [columns]="columns" 
      [data]="(sessions$ | async) || []"
      (actionClicked)="onActionClicked($event)">
    </app-data-table>
  </div>
</div>
