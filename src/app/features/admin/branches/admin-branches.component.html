<app-page-header title="Branches" subtitle="Create and modify coaching branches and centers">
  <div class="header-actions">
    <div class="institute-filter-box" *ngIf="isGlobalAdmin && institutes.length > 0">
      <span class="filter-icon">🏢</span>
      <select [(ngModel)]="selectedInstituteFilter" class="institute-select">
        <option value="all">🌐 All Coaching Centers ({{ institutes.length }})</option>
        <option *ngFor="let inst of institutes" [value]="inst.id">{{ inst.name }} ({{ inst.instituteCode }})</option>
      </select>
    </div>
    <button class="btn btn-primary" (click)="toggleForm()">
      <svg *ngIf="!showForm" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      <svg *ngIf="showForm" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      {{ showForm ? 'Close Form' : '+ Add Branch' }}
    </button>
  </div>
</app-page-header>

<div class="branches-container">
  <!-- Collapsible Branch Form -->
  <div class="form-card card" *ngIf="showForm">
    <div class="form-card-header">
      <div>
        <h3>
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="header-icon"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>
          {{ editingId ? 'Edit Branch' : 'Add New Branch' }}
        </h3>
        <p>Register branch codes, campus names, contact points and physical addresses</p>
      </div>
      <button type="button" class="btn-close" (click)="toggleForm()">✕</button>
    </div>
    
    <div class="form-card-body">
      <form [formGroup]="branchForm" (ngSubmit)="onSubmit()" class="branch-form">
        <div class="form-grid">
          <!-- Target Institute Selector for Super Admin -->
          <div class="form-group" *ngIf="isGlobalAdmin && !editingId" style="grid-column: 1 / -1;">
            <label>Target Coaching Center / Institute <span class="required-star">*</span></label>
            <select class="form-control" formControlName="instituteId" style="border: 2px solid #6366f1; background-color: #f8fafc; font-weight: 600;">
              <option value="">Default / Active Institute</option>
              <option *ngFor="let inst of institutes" [value]="inst.id">{{ inst.name }} ({{ inst.instituteCode }})</option>
            </select>
          </div>

          <!-- Branch Code -->
          <div class="form-group">
            <label>Branch Code <span class="required-star">*</span></label>
            <input type="text" class="form-control" formControlName="code" placeholder="e.g. BR-DEL-01" />
            <span class="error-msg" *ngIf="branchForm.get('code')?.touched && branchForm.get('code')?.hasError('required')">
              Branch code is required
            </span>
          </div>

          <!-- Branch Name -->
          <div class="form-group">
            <label>Branch Name <span class="required-star">*</span></label>
            <input type="text" class="form-control" formControlName="name" placeholder="e.g. Main Campus / City Center" />
            <span class="error-msg" *ngIf="branchForm.get('name')?.touched && branchForm.get('name')?.hasError('required')">
              Branch name is required
            </span>
          </div>

          <!-- Contact Number -->
          <div class="form-group">
            <label>Contact Number</label>
            <input type="text" class="form-control" formControlName="contactNumber" placeholder="e.g. 9876543210" />
          </div>

          <!-- Status (Edit) -->
          <div class="form-group" *ngIf="editingId">
            <label>Branch Status</label>
            <select class="form-control" formControlName="isActive">
              <option [ngValue]="true">Active</option>
              <option [ngValue]="false">Inactive</option>
            </select>
          </div>

          <!-- Address -->
          <div class="form-group full-width">
            <label>Address</label>
            <textarea class="form-control" formControlName="address" rows="2" placeholder="Enter branch full address and location details..."></textarea>
          </div>
        </div>

        <div class="form-actions">
          <button type="button" class="btn btn-light" (click)="toggleForm()">Cancel</button>
          <button type="submit" class="btn btn-primary" [disabled]="branchForm.invalid || (isLoading$ | async)">
            {{ editingId ? 'Update Branch' : 'Create Branch' }}
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Branches Table List -->
  <div class="table-card card">
    <div *ngIf="isLoading$ | async" class="loading-indicator">
      <div class="spinner"></div>
      <p>Loading branches list...</p>
    </div>
    
    <app-data-table 
      *ngIf="!(isLoading$ | async)"
      [columns]="columns" 
      [data]="getFilteredBranches(branches$ | async)"
      (actionClicked)="onActionClicked($event)">
    </app-data-table>
  </div>
</div>
