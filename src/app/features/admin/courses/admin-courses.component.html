<app-page-header title="Courses" subtitle="Create and modify coaching programs and courses">
  <div class="header-actions">
    <div class="institute-filter-box" *ngIf="isGlobalAdmin && institutes.length > 0">
      <span class="filter-icon">🏢</span>
      <select [(ngModel)]="selectedInstituteFilter" class="institute-select">
        <option value="all">🌐 All Coaching Centers ({{ institutes.length }})</option>
        <option *ngFor="let inst of institutes" [value]="inst.id">{{ inst.name }} ({{ inst.instituteCode }})</option>
      </select>
    </div>
    <button class="btn btn-primary" (click)="toggleAddForm()">
      <svg *ngIf="!showAddForm" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      <svg *ngIf="showAddForm" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      {{ showAddForm ? 'Close Form' : '+ Add Course' }}
    </button>
  </div>
</app-page-header>

<div class="courses-container">
  <!-- Collapsible Course Form -->
  <div class="form-card card" *ngIf="showAddForm">
    <div class="form-card-header">
      <div>
        <h3>
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="header-icon"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
          {{ editingId ? 'Edit Course' : 'Add New Course' }}
        </h3>
        <p>Specify course details, duration, category and affiliated subjects</p>
      </div>
      <button type="button" class="btn-close" (click)="toggleAddForm()">✕</button>
    </div>
    
    <div class="form-card-body">
      <form [formGroup]="courseForm" (ngSubmit)="onSubmit()" class="course-form">
        <div class="form-grid">
          <!-- Target Institute Selector for Super Admin -->
          <div class="form-group" *ngIf="isGlobalAdmin && !editingId" style="grid-column: 1 / -1;">
            <label>Target Coaching Center / Institute <span class="required-star">*</span></label>
            <select class="form-control" formControlName="instituteId" style="border: 2px solid #6366f1; background-color: #f8fafc; font-weight: 600;">
              <option value="">Default / Active Institute</option>
              <option *ngFor="let inst of institutes" [value]="inst.id">{{ inst.name }} ({{ inst.instituteCode }})</option>
            </select>
          </div>

          <!-- Course Code -->
          <div class="form-group">
            <label>Course Code <span class="required-star">*</span></label>
            <input type="text" class="form-control" formControlName="courseCode" placeholder="e.g. PHY-101" />
            <span class="error-msg" *ngIf="courseForm.get('courseCode')?.touched && courseForm.get('courseCode')?.hasError('required')">
              Course code is required
            </span>
          </div>

          <!-- Course Name -->
          <div class="form-group">
            <label>Course Name <span class="required-star">*</span></label>
            <input type="text" class="form-control" formControlName="name" placeholder="e.g. JEE Advanced Physics" />
            <span class="error-msg" *ngIf="courseForm.get('name')?.touched && courseForm.get('name')?.hasError('required')">
              Course name is required
            </span>
          </div>

          <!-- Course Category -->
          <div class="form-group">
            <label>Course Category <span class="required-star">*</span></label>
            <input type="text" class="form-control" formControlName="courseCategory" placeholder="e.g. Engineering, Medical" />
            <span class="error-msg" *ngIf="courseForm.get('courseCategory')?.touched && courseForm.get('courseCategory')?.hasError('required')">
              Course category is required
            </span>
          </div>

          <!-- Course Type -->
          <div class="form-group">
            <label>Course Type <span class="required-star">*</span></label>
            <select class="form-control" formControlName="courseType">
              <option value="Offline">Offline</option>
              <option value="Online">Online</option>
              <option value="Hybrid">Hybrid</option>
            </select>
          </div>

          <!-- Duration Value -->
          <div class="form-group">
            <label>Duration <span class="required-star">*</span></label>
            <div class="duration-input-group">
              <input type="number" class="form-control" formControlName="durationValue" min="1" />
              <select class="form-control duration-select" formControlName="durationType">
                <option value="Days">Days</option>
                <option value="Weeks">Weeks</option>
                <option value="Months">Months</option>
                <option value="Years">Years</option>
              </select>
            </div>
          </div>

          <!-- Description -->
          <div class="form-group full-width">
            <label>Description</label>
            <textarea class="form-control" formControlName="description" rows="2" placeholder="Enter course syllabus or general description..."></textarea>
          </div>

          <!-- Affiliated Subjects Section -->
          <div class="form-group full-width subjects-section">
            <label>Affiliated Subjects / Modules</label>
            <div class="subject-input-box">
              <input type="text" class="form-control" formControlName="subjectInput" placeholder="Enter subject name (e.g. Kinematics, Optics)" (keyup.enter)="addSubject()" />
              <button type="button" class="btn btn-secondary btn-sm" (click)="addSubject()">+ Add Subject</button>
            </div>
            
            <div class="tags-container mt-2" *ngIf="subjectsList.length > 0">
              <span class="subject-tag" *ngFor="let s of subjectsList; let i = index">
                {{ s }}
                <span class="tag-close" (click)="removeSubject(i)">✕</span>
              </span>
            </div>
          </div>
        </div>

        <div class="form-actions">
          <button type="button" class="btn btn-light" (click)="cancelEdit()">Cancel</button>
          <button type="submit" class="btn btn-primary" [disabled]="courseForm.invalid || (isLoading$ | async)">
            {{ editingId ? 'Update Course' : 'Create Course' }}
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Courses Table List -->
  <div class="table-card card">
    <div *ngIf="isLoading$ | async" class="loading-indicator">
      <div class="spinner"></div>
      <p>Loading courses catalogue...</p>
    </div>
    
    <app-data-table 
      *ngIf="!(isLoading$ | async)"
      [columns]="columns" 
      [data]="getFilteredCourses(courses$ | async)"
      (actionClicked)="onActionClicked($event)">
    </app-data-table>
  </div>
</div>
