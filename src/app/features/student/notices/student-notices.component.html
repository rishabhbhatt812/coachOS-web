<app-page-header title="Notice Board" subtitle="Stay updated with announcements and official notifications from institute administration"></app-page-header>

<div class="notices-container">
  <div *ngIf="isLoading$ | async" class="loading-indicator">
    <div class="spinner"></div>
    <p>Loading notice board...</p>
  </div>

  <div *ngIf="!(isLoading$ | async)" class="notices-list">
    <div *ngFor="let notice of notices$ | async" class="notice-card card">
      <div class="card-header">
        <div class="header-main">
          <svg class="bell-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
          <h3>{{ notice.title }}</h3>
        </div>
        <span class="notice-date">{{ notice.createdAt | date:'mediumDate' }}</span>
      </div>
      <div class="card-body">
        <p class="message">{{ notice.message }}</p>
      </div>
    </div>

    <div *ngIf="((notices$ | async) || []).length === 0" class="no-records-card card">
      <p>No notices have been posted on your notice board yet.</p>
    </div>
  </div>
</div>
