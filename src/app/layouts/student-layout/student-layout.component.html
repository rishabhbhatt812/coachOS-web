<div class="app-layout">
  <!-- Desktop Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="brand" *ngIf="tenant$ | async as tenant; else defaultBrand">
        <img [src]="tenant.logoUrl || '/logo.png'" alt="Logo" style="width: 36px; height: 36px; border-radius: 8px; object-fit: contain; background: white; padding: 2px;" />
        <div class="brand-text">
          <h2 [title]="tenant.name" style="text-overflow: ellipsis; overflow: hidden; white-space: nowrap; max-width: 140px; font-size: 16px; font-weight: 700; margin: 0;">{{ tenant.name || 'EduNex' }}</h2>
          <p style="margin: 0; font-size: 11px;">Student Portal</p>
        </div>
      </div>
      <ng-template #defaultBrand>
        <div class="brand">
          <img src="/logo.png" alt="EduNex Logo" style="width: 36px; height: 36px; border-radius: 8px; object-fit: contain; background: white; padding: 2px;" />
          <div class="brand-text">
            <h2>EduNex</h2>
            <p>Student Portal</p>
          </div>
        </div>
      </ng-template>
    </div>
    
    <nav class="sidebar-nav">
      <a routerLink="/student/dashboard" routerLinkActive="active">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        <span>Dashboard</span>
      </a>
      <a routerLink="/student/my-course" routerLinkActive="active" *ngIf="hasModuleAccess('LEARNING')">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
        <span>My Course</span>
      </a>
      <a routerLink="/student/my-fees" routerLinkActive="active" *ngIf="hasModuleAccess('FEES')">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
        <span>Fees</span>
      </a>
      <a routerLink="/student/my-attendance" routerLinkActive="active" *ngIf="hasModuleAccess('ATTENDANCE')">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
        <span>Attendance</span>
      </a>
      <a routerLink="/student/my-notes" routerLinkActive="active" *ngIf="hasModuleAccess('LEARNING')">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
        <span>My Notes</span>
      </a>
      <a routerLink="/student/my-results" routerLinkActive="active" *ngIf="hasModuleAccess('LEARNING')">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
        <span>Results</span>
      </a>
      <a routerLink="/student/vacancies" routerLinkActive="active" *ngIf="hasModuleAccess('LEARNING')">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>
        <span>Vacancies</span>
      </a>
      <a routerLink="/student/notices" routerLinkActive="active" *ngIf="hasModuleAccess('COMMUNICATION')">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
        <span>Notices</span>
      </a>
      <a routerLink="/student/profile" routerLinkActive="active">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        <span>My Profile</span>
      </a>
    </nav>
  </aside>

  <!-- Main Area -->
  <div class="main-container">
    <!-- Topbar Header -->
    <header class="topbar" style="justify-content: space-between;">
      <div class="topbar-brand" style="display: flex; align-items: center; gap: 8px; margin-right: auto;" *ngIf="tenant$ | async as tenant; else defaultTopbarBrand">
        <img [src]="tenant.logoUrl || '/logo.png'" alt="Logo" style="height: 32px; border-radius: 6px; background: white; padding: 2px;" />
        <span style="font-weight: 700; color: var(--text-main); font-size: 16px;">{{ tenant.name || 'EduNex' }}</span>
      </div>
      <ng-template #defaultTopbarBrand>
        <div class="topbar-brand" style="display: flex; align-items: center; gap: 8px; margin-right: auto;">
          <img src="/logo.png" alt="EduNex Logo" style="height: 32px; border-radius: 6px; background: white; padding: 2px;" />
          <span style="font-weight: 700; color: var(--text-main); font-size: 16px;">EduNex</span>
        </div>
      </ng-template>
      <div class="user-profile" *ngIf="user$ | async as user">
        <div class="profile-details" style="text-align: right;">
          <span class="user-name" style="display: block; font-weight: 600; color: var(--text-main);">{{ user.name }}</span>
          <span class="user-role" style="display: block; font-size: 11px; color: var(--text-muted); line-height: 1.2;">
            Student
            <span *ngIf="user.branchName" style="display: block; font-size: 10px; font-weight: 600; color: #6366f1;">{{ user.branchName }}</span>
          </span>
        </div>
        <div class="profile-avatar" [title]="(user.instituteName || '') + (user.branchName ? ' - ' + user.branchName : '')">{{ user.name.charAt(0) }}</div>
        <button class="logout-action-btn" (click)="logout()" title="Logout">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
        </button>
      </div>
    </header>

    <!-- Main Content Area -->
    <main class="content-body">
      <router-outlet></router-outlet>
    </main>
  </div>

  <!-- Mobile Bottom Navigation -->
  <nav class="bottom-nav">
    <a routerLink="/student/dashboard" routerLinkActive="active" class="nav-item">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
      <span class="label">Home</span>
    </a>
    <a routerLink="/student/my-fees" routerLinkActive="active" class="nav-item" *ngIf="hasModuleAccess('FEES')">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
      <span class="label">Fee</span>
    </a>
    <a routerLink="/student/my-results" routerLinkActive="active" class="nav-item" *ngIf="hasModuleAccess('LEARNING')">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
      <span class="label">Result</span>
    </a>
    <a (click)="logout()" class="nav-item">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
      <span class="label">Logout</span>
    </a>
  </nav>
</div>
