<!-- 1. NEW VERSION AVAILABLE TOAST -->
<div class="pwa-toast-banner update-banner" *ngIf="updateAvailable$ | async">
  <div class="toast-content">
    <div class="toast-icon">🚀</div>
    <div class="toast-text">
      <strong>New Update Available!</strong>
      <span>An upgraded version of EduNex is ready.</span>
    </div>
  </div>
  <div class="toast-actions">
    <button type="button" class="btn-pwa-action" (click)="updateApp()">
      Update Now
    </button>
  </div>
</div>

<!-- 2. DESKTOP / ANDROID PWA INSTALL TOAST -->
<div class="pwa-toast-banner install-banner" *ngIf="isInstallable$ | async">
  <div class="toast-content">
    <img src="/logo.png" alt="EduNex App" class="pwa-app-icon" />
    <div class="toast-text">
      <strong>Install EduNex App</strong>
      <span>Quick desktop & mobile access with offline support</span>
    </div>
  </div>
  <div class="toast-actions">
    <button type="button" class="btn-pwa-action" (click)="installApp()">
      📲 Install App
    </button>
    <button type="button" class="btn-pwa-dismiss" (click)="dismiss()" title="Dismiss">
      ✕
    </button>
  </div>
</div>

<!-- 3. IOS ADD TO HOME SCREEN GUIDANCE -->
<div class="pwa-toast-banner ios-banner" *ngIf="(isIos$ | async) && showIosGuide">
  <div class="toast-content">
    <img src="/logo.png" alt="EduNex App" class="pwa-app-icon" />
    <div class="toast-text">
      <strong>Install on iPhone / iPad:</strong>
      <span>Tap <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg> <strong>Share</strong> in Safari, then select <strong>"Add to Home Screen"</strong></span>
    </div>
  </div>
  <div class="toast-actions">
    <button type="button" class="btn-pwa-dismiss" (click)="dismiss()" title="Dismiss">
      ✕
    </button>
  </div>
</div>
