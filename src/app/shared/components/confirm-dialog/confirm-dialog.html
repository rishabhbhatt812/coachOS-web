<div class="confirm-modal-wrapper" [ngClass]="'type-' + (data.type || 'info')">
  <!-- Header / Icon Badge -->
  <div class="modal-top">
    <div class="icon-bubble" [ngClass]="data.type || 'info'">
      <!-- Danger / Delete Icon -->
      <svg *ngIf="data.type === 'danger'" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 6h18"></path>
        <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path>
        <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path>
        <line x1="10" y1="11" x2="10" y2="17"></line>
        <line x1="14" y1="11" x2="14" y2="17"></line>
      </svg>

      <!-- Warning Icon -->
      <svg *ngIf="data.type === 'warning'" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"></path>
        <line x1="12" y1="9" x2="12" y2="13"></line>
        <line x1="12" y1="17" x2="12.01" y2="17"></line>
      </svg>

      <!-- Success Icon -->
      <svg *ngIf="data.type === 'success'" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
        <polyline points="22 4 12 14.01 9 11.01"></polyline>
      </svg>

      <!-- Info Icon (default) -->
      <svg *ngIf="!data.type || data.type === 'info'" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="16" x2="12" y2="12"></line>
        <line x1="12" y1="8" x2="12.01" y2="8"></line>
      </svg>
    </div>

    <button type="button" class="btn-close-modal" (click)="onCancel()" *ngIf="!data.isAlert">✕</button>
  </div>

  <!-- Dialog Body -->
  <div class="modal-body">
    <h3 class="modal-title">{{ data.title }}</h3>
    <p class="modal-message">{{ data.message }}</p>
  </div>

  <!-- Modal Action Buttons -->
  <div class="modal-actions">
    <button type="button" class="btn btn-light cancel-btn" (click)="onCancel()" *ngIf="!data.isAlert">
      {{ data.cancelText || 'Cancel' }}
    </button>
    <button 
      type="button" 
      class="btn confirm-btn" 
      [ngClass]="data.type === 'danger' ? 'btn-danger' : (data.type === 'success' ? 'btn-success' : 'btn-primary')"
      (click)="onConfirm()">
      {{ data.confirmText || (data.isAlert ? 'OK' : 'Confirm') }}
    </button>
  </div>
</div>
