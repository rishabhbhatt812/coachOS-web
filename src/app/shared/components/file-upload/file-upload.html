<div class="file-upload-container">
  <div 
    class="drop-zone" 
    [class.dragging]="isDragging"
    (dragover)="onDragOver($event)" 
    (dragleave)="onDragLeave($event)" 
    (drop)="onDrop($event)">
    
    <div class="drop-zone-content" *ngIf="!selectedFile">
      <mat-icon class="upload-icon">cloud_upload</mat-icon>
      <h3>Drag & drop a file here</h3>
      <p class="text-xs text-gray-400 my-1">or</p>
      <button type="button" class="btn btn-light" (click)="fileInput.click()" style="padding: 6px 16px; font-size: 13px; height: 36px;">
        Browse File
      </button>
      <input type="file" #fileInput (change)="onFileSelected($event)" [accept]="allowedTypes.join(',')" hidden />
      <div class="hint-text mt-2 text-xs text-gray-500">
        Allowed: {{ allowedTypes.join(', ') }} • Max size: {{ maxSizeBytes / (1024 * 1024) }}MB
      </div>
    </div>

    <div class="file-preview" *ngIf="selectedFile">
      <mat-icon class="file-icon">insert_drive_file</mat-icon>
      <div class="file-info">
        <div class="file-name">{{ selectedFile.name }}</div>
        <div class="file-size">{{ (selectedFile.size / 1024).toFixed(1) }} KB</div>
        <mat-progress-bar *ngIf="uploadProgress > 0 && uploadProgress < 100" mode="determinate" [value]="uploadProgress"></mat-progress-bar>
      </div>
      <button mat-icon-button color="warn" (click)="removeFile()" aria-label="Remove file">
        <mat-icon>delete</mat-icon>
      </button>
    </div>
  </div>

  <div class="error-message text-red-500 text-sm mt-2" *ngIf="errorMessage">
    <mat-icon inline>error_outline</mat-icon> {{ errorMessage }}
  </div>
</div>
